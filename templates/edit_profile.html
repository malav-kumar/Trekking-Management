{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header text-white"
                 style="background-color:#5DADE2;">

                <h3 class="mb-0 text-center">
                    Edit Profile
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ user.name }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ user.email }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="text"
                            name="password"
                            class="form-control"
                            value="{{ user.password }}"
                            required>

                    </div>

                    <div class="d-grid gap-2">

                        <button
                            type="submit"
                            class="btn text-white"
                            style="background-color:#5DADE2;">

                            Save Changes

                        </button>

                        <a href="{{ url_for('user_dashboard') }}"
                           class="btn btn-secondary">

                            Back to Dashboard

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
