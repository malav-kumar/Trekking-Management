{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header text-white"
                 style="background-color:#5DADE2;">

                <h3 class="mb-0 text-center">Edit Trek</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Trek Name</label>
                        <input type="text"
                               class="form-control"
                               name="trek_name"
                               value="{{ trek.trek_name }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text"
                               class="form-control"
                               name="location"
                               value="{{ trek.location }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Difficulty</label>

                        <select class="form-select"
                                name="difficulty">

                            <option value="Easy"
                                {% if trek.difficulty=="Easy" %}selected{% endif %}>
                                Easy
                            </option>

                            <option value="Moderate"
                                {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                                Moderate
                            </option>

                            <option value="Hard"
                                {% if trek.difficulty=="Hard" %}selected{% endif %}>
                                Hard
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Duration (Days)</label>
                        <input type="number"
                               class="form-control"
                               name="duration"
                               value="{{ trek.duration }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Available Slots</label>
                        <input type="number"
                               class="form-control"
                               name="available_slots"
                               value="{{ trek.available_slots }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>

                        <select class="form-select"
                                name="status">

                            <option value="Pending"
                                {% if trek.status=="Pending" %}selected{% endif %}>
                                Pending
                            </option>

                            <option value="Approved"
                                {% if trek.status=="Approved" %}selected{% endif %}>
                                Approved
                            </option>

                            <option value="Open"
                                {% if trek.status=="Open" %}selected{% endif %}>
                                Open
                            </option>

                            <option value="Closed"
                                {% if trek.status=="Closed" %}selected{% endif %}>
                                Closed
                            </option>

                            <option value="Completed"
                                {% if trek.status=="Completed" %}selected{% endif %}>
                                Completed
                            </option>

                        </select>

                    </div>

                    <div class="d-grid gap-2">

                        <button type="submit"
                                class="btn text-white"
                                style="background-color:#5DADE2;">

                            Update Trek

                        </button>

                        <a href="{{ url_for('view_treks') }}"
                           class="btn btn-secondary">

                            Back to Treks

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
